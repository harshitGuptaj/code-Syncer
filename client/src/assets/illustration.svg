  </defs>
  
  <rect x="30" y="50" width="340" height="240" rx="20" fill="url(#bgGrad)" stroke="#e94560" stroke-width="2"/>
  
  <rect x="45" y="65" width="30" height="30" rx="6" fill="#e94560"/>
  <path d="M52 80 L68 80 M52 85 L62 85" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
